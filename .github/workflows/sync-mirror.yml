name: Sync to Gitee and GitCode

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  # 取消注释可启用定时同步（每天 UTC 0 点）
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
          REPO: ${{ github.event.repository.name }}
        run: |
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${REPO}.git"
          git push gitee --force --all
          git push gitee --force --tags

      - name: Mirror to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_USER: ${{ secrets.GITCODE_USER }}
          REPO: ${{ github.event.repository.name }}
        run: |
          git remote add gitcode "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${GITCODE_USER}/${REPO}.git"
          git push gitcode --force --all
          git push gitcode --force --tags
